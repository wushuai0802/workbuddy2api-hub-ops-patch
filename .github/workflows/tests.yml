name: Offline patch tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the pinned official baseline
        run: |
          git clone --no-checkout https://github.com/ardeyouxipianyi/workbuddy2api-hub.git ../workbuddy-upstream
          git -C ../workbuddy-upstream checkout --detach 84dbc99b1a34182130ee9035f9d80b69a0fc2e8b
      - name: Verify the package
        run: python apply.py --verify-package
      - name: Run synthetic offline tests
        run: python scripts/test_offline.py --upstream ../workbuddy-upstream --output .work/verification
      - name: Run synthetic dashboard tests
        run: python scripts/test_dashboard.py --upstream ../workbuddy-upstream --output .work/dashboard
