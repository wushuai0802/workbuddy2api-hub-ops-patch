name: Offline patch tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Fetch the pinned official baseline
        run: |
          git clone --no-checkout https://github.com/ardeyouxipianyi/workbuddy2api-hub.git ../workbuddy-upstream
          git -C ../workbuddy-upstream checkout --detach d177043f873fd1e7132b3219be24e4f1f7abefda
      - name: Verify the package
        run: python apply.py --verify-package
      - name: Run synthetic offline tests
        run: python scripts/test_offline.py --upstream ../workbuddy-upstream --output .work/verification
      - name: Run synthetic dashboard tests
        run: python scripts/test_dashboard.py --upstream ../workbuddy-upstream --output .work/dashboard
      - name: Package the verified commit
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python scripts/build_release.py --output .work/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          name: release-bundle
          path: .work/release/*
          if-no-files-found: error
